<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <main class="login-card">
        <h1>PTZ Dashboard Login</h1>
        <p class="muted-text">대시보드에 접속하려면 로그인하세요.</p>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" class="login-form">
            <label>아이디</label>
            <input type="text" name="username" placeholder="admin" autocomplete="username" required>
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="1234" autocomplete="current-password" required>
            <button type="submit">Login</button>
        </form>
        <p class="login-help">기본값: admin / 1234<br>환경변수 DASHBOARD_USER, DASHBOARD_PASSWORD로 변경 가능</p>
    </main>
</body>
</html>
