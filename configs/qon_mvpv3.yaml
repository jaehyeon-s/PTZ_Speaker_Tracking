source: rtsp://192.168.11.88:554/stream2
region_mode: identity

video:
  # RTSP uses a latest-frame capture thread; keep this 0 unless extra frame skipping is needed.
  rtsp_drop_frames: 0
  rtsp_read_timeout: 2.0
  rtsp_first_read_timeout: 10.0

detector:
  backend: ncnn
  ncnn_param: models/yolo26n_ncnn_model/model.ncnn.param
  ncnn_bin: models/yolo26n_ncnn_model/model.ncnn.bin
  # YOLO model input size. This is not the RTSP frame size; stream2 is 640x360.
  ncnn_input_size: 416
  ncnn_input_name: in0
  ncnn_output_names: out0
  conf_threshold: 0.35
  nms_threshold: 0.45

registration:
  mode: marker
  reference: selected
  target_marker_id: 0
  register_on_start: true
  marker_positive: false
  timeout_frames: 90

reid:
  backend: hsv
  threshold: 0.68
  verify_every_frames: 30
  mismatch_limit: 10
  identity_weak_min_score: 0.25
  identity_margin: 0.08
  center_margin: 0.12
  identity_center_dead_zone: 0.18
  identity_hold_limit: 30

camera:
  url: http://192.168.11.88
  username: admin
  password_env: QON_PASS
  auth_mode: digest
  timeout: 5.0
  configure_supervisor_actuator: true

ptz:
  follow_target: true
  dead_zone: 0.12
  min_speed: 2
  max_speed: 10
  timeout: 1.0

logging:
  csv: logs/identity_supervisor.csv
