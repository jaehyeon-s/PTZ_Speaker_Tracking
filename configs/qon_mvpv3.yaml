source: rtsp://192.168.11.88:554/stream2
region_mode: identity

detector:
  backend: ncnn
  ncnn_param: models/yolo.param
  ncnn_bin: models/yolo.bin
  ncnn_input_size: 640
  conf_threshold: 0.35
  nms_threshold: 0.45

registration:
  mode: marker
  reference: selected
  target_marker_id: 7
  register_on_start: true
  marker_positive: false
  timeout_frames: 90

reid:
  backend: hsv
  threshold: 0.68
  verify_every_frames: 30
  mismatch_limit: 10
  identity_weak_min_score: 0.25
  identity_margin: 0.08
  center_margin: 0.12
  identity_center_dead_zone: 0.18
  identity_hold_limit: 30

camera:
  url: http://192.168.11.88
  username: admin
  password_env: QON_PASS
  auth_mode: digest
  configure_supervisor_actuator: true

ptz:
  follow_target: true
  dead_zone: 0.12
  min_speed: 2
  max_speed: 10

logging:
  csv: logs/identity_supervisor.csv
