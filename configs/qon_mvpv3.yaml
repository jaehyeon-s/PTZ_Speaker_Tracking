source: rtsp://192.168.11.88:554/stream2
# trackid: follow the presenter by a YOLO tracker id (ByteTrack) instead of HSV
# colour, so a passer-by cannot steal the track while the id is held.
region_mode: trackid

video:
  # RTSP uses a latest-frame capture thread; keep this 0 unless extra frame skipping is needed.
  rtsp_drop_frames: 0
  rtsp_read_timeout: 2.0
  rtsp_first_read_timeout: 10.0

detector:
  backend: ultralytics
  ncnn_param: models/yolo26n_ncnn_model/model.ncnn.param
  ncnn_bin: models/yolo26n_ncnn_model/model.ncnn.bin
  # YOLO model input size (used as ultralytics imgsz). Not the RTSP frame size; stream2 is 640x360.
  ncnn_input_size: 416
  ncnn_input_name: in0
  ncnn_output_names: out0
  conf_threshold: 0.35
  nms_threshold: 0.45

registration:
  # Register the presenter with an ArUco marker, or fall back to a raised-hand
  # gesture (MediaPipe) when no marker is available.
  mode: marker-or-gesture
  reference: selected
  target_marker_id: 0
  register_on_start: true
  marker_positive: false
  # The LOST -> reset -> re-register loop replaces marker-only auto re-registration.
  auto_reregister: false
  reregister_confirm_frames: 3
  timeout_frames: 90
  # Stay LOST this many seconds, then clear the presenter and return to registration.
  lost_reset_seconds: 3.0

reid:
  backend: hsv
  threshold: 0.68
  verify_every_frames: 30
  mismatch_limit: 10
  # Raised from 0.25/0.08 so a passer-by with a so-so colour match cannot be
  # accepted as the presenter; weak frames HOLD (and eventually LOST) instead.
  identity_weak_min_score: 0.35
  identity_margin: 0.12
  center_margin: 0.12
  identity_center_dead_zone: 0.18
  # Lower than the default 30 so a vanished presenter reaches LOST faster.
  identity_hold_limit: 12
  # Keep tracking the same person: a different candidate must beat the current
  # one by this score, and stay within position_gate_ratio of the last bbox.
  switch_margin: 0.15
  position_gate_ratio: 0.5

camera:
  url: http://192.168.11.88
  username: admin
  password_env: QON_PASS
  auth_mode: digest
  timeout: 5.0
  configure_supervisor_actuator: true

ptz:
  follow_target: true
  dead_zone: 0.12
  min_speed: 2
  max_speed: 10
  timeout: 1.0
  # Zoom in/out so the registered presenter fills ~60% of the frame height (upper body).
  zoom: true
  target_height_ratio: 0.6
  # Aim at the upper body (~0.3 down the box) so the face is framed, not the torso.
  vertical_aim_ratio: 0.3
  # Anti-hunting: after the subject fills the target band, the height must drift by
  # tolerance(0.08)+hysteresis before zooming again, and height is EMA-smoothed.
  # Raise zoom_hysteresis if zoom-in/zoom-out still oscillates.
  zoom_hysteresis: 0.1
  zoom_smoothing: 0.3
  # After LOST reset: go home (wide), then zoom in this many seconds to hold a
  # medium framing where a raised hand is big enough to register. Increase for a
  # tighter view, decrease (or 0) for wider.
  reset_zoom_in_seconds: 1.2
  reset_home_settle_seconds: 0.8

logging:
  csv: logs/identity_supervisor.csv
